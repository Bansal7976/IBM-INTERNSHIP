# YOLOv11-medium fine-tuned on KITTI
# Run: python training/train.py --config configs/yolov11/yolov11_kitti.yaml

framework: ultralytics

model:
  name: yolo11m            # Options: yolo11n, yolo11s, yolo11m, yolo11l, yolo11x
  weights: yolo11m.pt      # Pre-trained COCO weights (auto-downloaded)
  pretrained: true
  freeze_layers: null      # null = fine-tune all; integer = freeze first N layers

dataset:
  name: kitti
  yaml: data/kitti_yolo/kitti.yaml     # generated by data/prepare_kitti.py
  img_size: 640
  classes:
    - Car
    - Van
    - Truck
    - Pedestrian
    - Person_sitting
    - Cyclist
    - Tram
    - Misc

training:
  epochs: 500
  patience: 50             # early stopping if no improvement for 50 epochs
  batch_size: 16           # per GPU; effective = batch × num_gpus
  device: "0"              # "0" single GPU, "0,1,2,3" multi-GPU
  workers: 8
  project: runs/train
  name: yolo11m_kitti
  amp: true                # Automatic Mixed Precision (FP16) — ~2x speedup
  multi_scale: false

  # Optimizer
  optimizer: AdamW
  lr0: 0.001               # initial LR
  lrf: 0.01                # final LR = lr0 * lrf
  warmup_epochs: 3.0
  weight_decay: 0.0005
  save_period: 5           # save checkpoint every N epochs

  # Augmentation (tuned for vehicle detection)
  mosaic: 1.0              # mosaic augmentation probability
  mixup: 0.15
  copy_paste: 0.3
  degrees: 5.0             # rotation ±5°
  translate: 0.1
  scale: 0.5
  fliplr: 0.5
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
